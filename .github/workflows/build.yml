name: Build Frodo firmware

on:
  workflow_dispatch:
  push:
    branches:
      - ci/frodo

permissions:
  contents: write

jobs:
  build:
    name: Build spotpear sp-esp32-s3-1.28-box
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py spotpear/sp-esp32-s3-1.28-box --name sp-esp32-s3-1.28-box

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frodo_firmware_${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/xiaozhi.bin
            build/generated_assets.bin
            build/partition_table/partition-table.bin
            build/sdkconfig
            sdkconfig
          if-no-files-found: warn

      # The build output is also pushed to a separate branch so it can be
      # fetched with plain git (artifact downloads need a browser login).
      - name: Publish binaries to frodo-builds branch
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/out && cp build/xiaozhi.bin build/merged-binary.bin /tmp/out/
          cp build/generated_assets.bin build/partition_table/partition-table.bin sdkconfig /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b frodo-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build output of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" frodo-builds
