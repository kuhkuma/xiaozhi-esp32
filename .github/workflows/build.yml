name: Build Frodo firmware

on:
  workflow_dispatch:
  push:
    branches:
      - ci/frodo

permissions:
  contents: read

jobs:
  build:
    name: Build spotpear sp-esp32-s3-1.28-box
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py spotpear/sp-esp32-s3-1.28-box --name sp-esp32-s3-1.28-box

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frodo_firmware_${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/xiaozhi.bin
            build/generated_assets.bin
            build/partition_table/partition-table.bin
            build/sdkconfig
            sdkconfig
          if-no-files-found: warn
